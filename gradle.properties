org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Project identity
mod_id=handycam
mod_version=2.0.1-beta
mod_group=dev.vercim

# Dependency versions that apply to every target. Per-target values (Java, Minecraft ranges, loader and
# library versions) live in versions/<target>/gradle.properties.
fabric_loader_version=0.19.5

# neoforge.mods.toml keys for the mod icon; NeoForge 26.2 deprecates logoFile/logoBlur for iconFile/iconBlur.
neoforge_icon_file_key=logoFile
neoforge_icon_blur_key=logoBlur
