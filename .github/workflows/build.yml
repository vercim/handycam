name: Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.fabric.gradle.kts'
      - 'build.neoforge.gradle.kts'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.fabric.gradle.kts'
      - 'build.neoforge.gradle.kts'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all supported targets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all Stonecutter targets
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify artifacts
        shell: bash
        run: |
          mapfile -t target_dirs < <(find versions -mindepth 1 -maxdepth 1 -type d | sort)
          mapfile -t artifacts < <(find versions -path '*/build/libs/*.jar' -type f ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          test "${#target_dirs[@]}" -gt 0 || { echo "::error::No Stonecutter targets were found"; exit 1; }
          test "${#artifacts[@]}" -eq "${#target_dirs[@]}" || {
            echo "::error::Expected one release JAR per Stonecutter target, found ${#artifacts[@]} JARs for ${#target_dirs[@]} targets"
            exit 1
          }
