name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Minecraft 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and collect all Stonecutter targets
        run: |
          chmod +x gradlew
          ./gradlew buildAndCollect --no-daemon

      - name: Verify artifacts
        shell: bash
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          test -f "build/libs/handycam-${version}+1.21.1-fabric.jar"
          test -f "build/libs/handycam-${version}+1.21.1-neoforge.jar"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handycam-2.0.0-alpha-1.21.1
          path: build/libs/*.jar
