name: Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/build-telemetrika/**'
      - '.github/scripts/verify-release-jars.py'
      - 'src/**'
      - 'build.fabric.gradle.kts'
      - 'build.neoforge.gradle.kts'
      - 'build.forge.gradle.kts'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'gradle.properties'
      - 'gradle/*.gradle.kts'
      - 'versions/**/gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/build-telemetrika/**'
      - '.github/scripts/verify-release-jars.py'
      - 'src/**'
      - 'build.fabric.gradle.kts'
      - 'build.neoforge.gradle.kts'
      - 'build.forge.gradle.kts'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'gradle.properties'
      - 'gradle/*.gradle.kts'
      - 'versions/**/gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all supported targets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_telemetrikaEndpoint: https://telemetry.example.com/v1/snapshots

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Gradle itself needs JDK 25 (Fabric Loom 1.18); the last version listed becomes JAVA_HOME.
      # The mod compiles with JDK 17 (1.20.1), 21 (1.21.x) and 25 (26.x) toolchains.
      - name: Set up JDK 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the pinned Telemetrika core
        uses: ./.github/actions/build-telemetrika
        with:
          token: ${{ secrets.TELEMETRIKA_REPO_TOKEN }}

      - name: Build all Stonecutter targets
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify artifacts
        run: python3 .github/scripts/verify-release-jars.py
