name: Build the pinned Telemetrika core
description: Check out and build the Telemetrika JAR used by HandyCam

inputs:
  token:
    description: Token with read access to vercim/telemetrika
    required: true

runs:
  using: composite
  steps:
    - name: Verify access is configured
      shell: bash
      env:
        TELEMETRIKA_REPO_TOKEN: ${{ inputs.token }}
      run: |
        test -n "$TELEMETRIKA_REPO_TOKEN" || { echo '::error::Set the TELEMETRIKA_REPO_TOKEN Actions secret'; exit 1; }

    - name: Check out Telemetrika
      uses: actions/checkout@v7
      with:
        repository: vercim/telemetrika
        ref: 1507c67102487e0fb95500633e4495a22a48a74a
        token: ${{ inputs.token }}
        path: .telemetrika-core
        persist-credentials: false

    - name: Build Telemetrika JAR
      shell: bash
      run: |
        bash .telemetrika-core/gradlew -p .telemetrika-core jar --no-daemon
        core_jar="$GITHUB_WORKSPACE/.telemetrika-core/build/libs/telemetrika-core-0.1.0-SNAPSHOT.jar"
        test -s "$core_jar" || { echo '::error::Missing Telemetrika core JAR'; exit 1; }
        printf 'ORG_GRADLE_PROJECT_telemetrikaJar=%s\n' "$core_jar" >> "$GITHUB_ENV"
