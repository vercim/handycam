modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "LGPL-3.0-only"

[[mods]]
modId = "handycam"
version = "${version}"
displayName = "Handycam"
${neoforge_icon_file_key} = "icon.png"
${neoforge_icon_blur_key} = false
displayURL = "https://modrinth.com/mod/handycam"
authors = "vercim"
description = '''
Cinematic camera shake for Minecraft
'''

[[dependencies.handycam]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.handycam]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.handycam]]
modId = "cloth_config"
type = "required"
versionRange = "${cloth_config_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "handycam.mixins.json"